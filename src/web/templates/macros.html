{# Clickable (i) next to section headings. #}
{% macro h2_info(id, title, tip) -%}
<div class="h2-with-tip">
  <h2 id="heading-{{ id }}">{{ title }}</h2>
  <details class="info-tip">
    <summary class="info-btn" aria-labelledby="heading-{{ id }}">
      <span aria-hidden="true">i</span>
      <span class="visually-hidden">Explicação da seção</span>
    </summary>
    <p class="info-panel">{{ tip }}</p>
  </details>
</div>
{%- endmacro %}
