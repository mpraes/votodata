<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VotoData{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Ir ao conteúdo</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">VotoData</a>
      <nav class="nav" aria-label="Principal">
        <a href="/" class="{% if section == 'home' %}is-active{% endif %}">Início</a>
        <a href="/tse" class="{% if section == 'tse' %}is-active{% endif %}">Metadados TSE</a>
        <a href="/tse/health" class="{% if section == 'health' %}is-active{% endif %}">Saúde</a>
        <a href="/tse/about" class="{% if section == 'about' %}is-active{% endif %}">Sobre</a>
      </nav>
    </div>
    <div class="boletim-strip" aria-hidden="true">
      <span>JE</span>
      <span>CATÁLOGO</span>
      <span>DADOS ABERTOS</span>
    </div>
  </header>

  <main id="main" class="shell main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p>VotoData — leitura do schema <code>dados_tse</code>. Acesso local / Tailscale.</p>
    </div>
  </footer>
</body>
</html>
